<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g transform="translate(0, 10)">
    <!-- Outer Orange Arc / Brow -->
    <path d="M12 40 C 25 15, 68 15, 88 35 C 78 22, 42 20, 22 36 Z" fill="#F36B16" />
    <!-- Upper Inner Orange Accent -->
    <path d="M26 34 C 40 18, 72 20, 85 36 C 75 25, 45 22, 28 35 Z" fill="#F36B16" opacity="0.9" />
    
    <!-- Navy Blue Eye Contour -->
    <path d="M10 40 C 30 18, 70 18, 90 40 C 70 65, 30 65, 10 40 Z" stroke="#142F80" stroke-width="7" stroke-linejoin="round" fill="none" />
    
    <!-- Iris Circle (Navy) -->
    <circle cx="50" cy="40" r="16" fill="#142F80" />
    
    <!-- Inner Pupil Accent (Orange) -->
    <circle cx="50" cy="40" r="9" fill="#F36B16" />
    
    <!-- Light Reflection -->
    <circle cx="46" cy="36" r="3.5" fill="#FFFFFF" />
    
    <!-- Lower Navy Swoosh Accent -->
    <path d="M12 45 C 32 70, 75 66, 88 46 C 72 61, 35 62, 16 46 Z" fill="#142F80" />
  </g>
</svg>

